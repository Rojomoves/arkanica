[build]
publish = "."
functions = "netlify/functions"

# 1. Prioridad absoluta para las funciones Serverless / API de Stripe y Supabase
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/:splat"
status = 200

# 2. Asegurar que la carpeta de assets cargue de forma directa
[[redirects]]
from = "/assets/*"
to = "/assets/:splat"
status = 200

# 3. Redirecciones permanentes (301) para limpiar errores anteriores en buscadores o rastreos
[[redirects]]
from = "/sesion-ente"
to = "/ente-superior"
status = 301

[[redirects]]
from = "/ente-superior/ente-superior.html"
to = "/ente-superior"
status = 301

[[redirects]]
from = "/blog/coincidencia-o-sincronicidad-cartas-repetidas.html"
to = "/blog/sincronicidad-y-cartas-repetidas-en-el-tarot"
status = 301

# 4. URLs limpias para tus páginas principales en la raíz
[[redirects]]
from = "/tienda"
to = "/tienda.html"
status = 200

[[redirects]]
from = "/comunidad-privada"
to = "/comunidad-privada.html"
status = 200

[[redirects]]
from = "/sesiones-privadas"
to = "/sesiones-privadas.html"
status = 200

[[redirects]]
from = "/ente-superior"
to = "/ente-superior.html"
status = 200

[[redirects]]
from = "/blog"
to = "/blog.html"
status = 200

# 5. Regla comodín general para cualquier otra página HTML
[[redirects]]
from = "/*"
to = "/:splat.html"
status = 200