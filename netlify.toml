[build]
publish = "."
functions = "netlify/functions"

# 1. Prioridad absoluta para las funciones Serverless / API
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/:splat"
status = 200

# 2. Asegurar que la carpeta de assets y archivos estáticos carguen directo
[[redirects]]
from = "/assets/*"
to = "/assets/:splat"
status = 200

# 3. Mapeo limpio para URLs sin extensión que carguen su respectivo .html internamente
[[redirects]]
from = "/comunidad-privada"
to = "/comunidad-privada.html"
status = 200

[[redirects]]
from = "/sesiones-privadas"
to = "/sesiones-privadas.html"
status = 200

[[redirects]]
from = "/ente-superior"
to = "/ente-superior.html"
status = 200

[[redirects]]
from = "/blog"
to = "/blog.html"
status = 200

# 4. Regla general limpia para el resto de páginas del sitio
[[redirects]]
from = "/*"
to = "/:splat.html"
status = 200