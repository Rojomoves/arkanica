[build]
publish = "."
functions = "netlify/functions"

# 1. Redirección para las funciones Serverless / API (debe ir primero)
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/:splat"
status = 200

# 2. URLs limpias para páginas HTML (excluyendo archivos con extensiones estáticas)
[[redirects]]
from = "/*.:ext"
to = "/:splat.:ext"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/:splat.html"
status = 200