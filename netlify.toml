[build]
publish = "."
functions = "netlify/functions"

# 1. Redirección para las funciones Serverless / API (debe ir primero)
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/:splat"
status = 200

# 2. Regla global para ocultar la extensión .html en todas las páginas (URLs limpias)
[[redirects]]
from = "/*"
to = "/:splat.html"
status = 200
force = false